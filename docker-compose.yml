
services:
  backend:
    image: ghcr.io/piyumal-sandaruwan/i-computers-backend:latest
    container_name: icomputers-backend
    restart: unless-stopped
    env_file:
      - backend.env
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - icomputers-network

  frontend:
    image: ghcr.io/piyumal-sandaruwan/i-computers-frontend:latest
    container_name: icomputers-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - icomputers-network

networks:
  icomputers-network:
    driver: bridge
