
services:
  backend:
    image: icomputersacr-e3c6a6aue2d2b2da.azurecr.io/i-computers-backend:latest
    container_name: icomputers-backend
    restart: unless-stopped
    env_file:
      - backend.env
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - icomputers-network

  frontend:
    image: icomputersacr-e3c6a6aue2d2b2da.azurecr.io/i-computers-frontend:latest
    container_name: icomputers-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    networks:
      - icomputers-network

networks:
  icomputers-network:
    driver: bridge
